<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#111b17"><meta name="description" content="LeanTrack — your private, six-month fitness dashboard.">
<title>LeanTrack | Your fitness journey</title><link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="shell">
  <aside class="sidebar">
    <div class="brand"><div class="brand-icon">L<span>↗</span></div><div><strong>LeanTrack</strong><small>PERSONAL FITNESS</small></div></div>
    <nav aria-label="Main navigation">

      <button class="nav-link" data-view="nutrition"><span>◉</span> Nutrition</button>

</div>
